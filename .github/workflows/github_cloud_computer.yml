name: Cloud PC (Manual)

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH & frpc
        env:
          ROOT_PASSWD: ${{ secrets.ROOT_PASSWD }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_PASSWD: ${{ secrets.USER_PASSWD }}
          FRPC_CONFIG: ${{ secrets.FRPC_CONFIG }}
        run: |
          set -e

          echo "==== 0. 校验必填 Secret ===="
          : "${ROOT_PASSWD:?缺少 Secret ROOT_PASSWD，请在仓库 Settings->Secrets 配置}"
          : "${USER_NAME:?缺少 Secret USER_NAME}"
          : "${USER_PASSWD:?缺少 Secret USER_PASSWD}"
          : "${FRPC_CONFIG:?缺少 Secret FRPC_CONFIG}"

          echo "==== 1. 安装并配置 sshd ===="
          sudo apt-get update
          sudo apt-get install -y openssh-server

          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A

          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*UsePAM.*/UsePAM yes/' /etc/ssh/sshd_config

          echo "==== 2. 设置 root 密码 ===="
          echo "root:${ROOT_PASSWD}" | sudo chpasswd

          echo "==== 3. 创建普通用户并加入 sudo 组 ===="
          sudo useradd -m -s /bin/bash "${USER_NAME}" || true
          echo "${USER_NAME}:${USER_PASSWD}" | sudo chpasswd
          sudo usermod -aG sudo "${USER_NAME}"

          echo "==== 4. 写入 frpc 配置 ===="
          printf '%s\n' "${FRPC_CONFIG}" > /tmp/frpc.toml

          echo "==== 5. 下载并启动 frpc ===="
          FRPC_VER="0.53.2"
          curl -sSL "https://github.com/fatedier/frp/releases/download/v${FRPC_VER}/frp_${FRPC_VER}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo /tmp/frp_${FRPC_VER}_linux_amd64/frpc -c /tmp/frpc.toml &

          echo "==== 6. 前台运行 sshd（-D），日志实时可见 ===="
          sudo /usr/sbin/sshd -D -e
